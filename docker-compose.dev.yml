# Development environment
version: '3.8'

services:
  # PostgreSQL Database for Development
  database:
    image: postgres:15-alpine
    container_name: learninslices-db-dev
    environment:
      POSTGRES_DB: learninslices_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - learninslices-dev-network

  # Redis for Development
  redis:
    image: redis:7-alpine
    container_name: learninslices-redis-dev
    ports:
      - "6380:6379"
    networks:
      - learninslices-dev-network

volumes:
  postgres_dev_data:
    driver: local

networks:
  learninslices-dev-network:
    driver: bridge
